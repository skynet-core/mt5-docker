name: Publish source coverage

on:
  workflow_run:
    workflows: ['Build, test and publish images']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful default-branch build run containing source-coverage
        type: string
        required: true

permissions:
  contents: read

# Independent of image builds; README updates never supersede their runs.
concurrency:
  group: coverage-pages-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  site:
    name: Prepare verified coverage site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      revision: ${{ steps.source.outputs.revision }}
      run_url: ${{ steps.source.outputs.run_url }}
      pages_url: ${{ steps.pages.outputs.base_url }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false

      - name: Validate the completed source workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run_id=${REQUESTED_RUN_ID:-$COMPLETED_RUN_ID}
          [[ $run_id =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/coverage-run.json"
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
            .head_repository.full_name == $repository and .head_branch == $branch and
            .path == ".github/workflows/build-and-publish.yml" and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and .conclusion == "success" and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/coverage-run.json" >/dev/null; then
            echo '::error::Select a successful default-branch image workflow from this repository.'
            exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "revision=$(jq -r .head_sha "$RUNNER_TEMP/coverage-run.json")"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download measured source coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-coverage
          path: ${{ runner.temp }}/source-coverage
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          digest-mismatch: error

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Render public reports from the passing per-file gate
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          SOURCE_RUN_URL: ${{ steps.source.outputs.run_url }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          cp README.md "$RUNNER_TEMP/coverage-README.md"
          uv run --locked --no-dev python build/publish_coverage.py \
            --report "$RUNNER_TEMP/source-coverage/report/coverage.json" \
            --artifact-root "$RUNNER_TEMP/source-coverage" \
            --output "$RUNNER_TEMP/coverage-site" --readme "$RUNNER_TEMP/coverage-README.md" \
            --repository "$GITHUB_REPOSITORY" --revision "$REVISION" \
            --run-url "$SOURCE_RUN_URL" --pages-url "$PAGES_URL"

      - name: Upload only the rendered static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/coverage-site

  deploy:
    name: Deploy coverage to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified coverage
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  readme:
    name: Update the README coverage report
    needs: [site, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false

      - name: Download the verified source report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-coverage
          path: ${{ runner.temp }}/source-coverage
          github-token: ${{ github.token }}
          run-id: ${{ needs.site.outputs.run_id }}
          digest-mismatch: error

      - name: Refresh only the generated README block on the latest branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ needs.site.outputs.revision }}
          SOURCE_RUN_URL: ${{ needs.site.outputs.run_url }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git switch --detach "origin/$DEFAULT_BRANCH"
            uv run --locked --no-dev python build/publish_coverage.py \
              --report "$RUNNER_TEMP/source-coverage/report/coverage.json" \
              --output "$RUNNER_TEMP/readme-coverage-site-$attempt" --readme README.md \
              --repository "$GITHUB_REPOSITORY" --revision "$REVISION" \
              --run-url "$SOURCE_RUN_URL" --pages-url "$PAGES_URL"
            if git diff --quiet -- README.md; then exit 0; fi
            git add README.md
            git commit -m 'docs: update coverage report [skip ci]'
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
          done
          echo '::error::README changed during all three publication attempts; no force push was attempted.'
          exit 1
