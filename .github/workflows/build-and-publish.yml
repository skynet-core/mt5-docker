name: Build, test and publish images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Run broker acceptance and publish tested images
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mt5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE_FILE: ${{ github.workspace }}/artifacts/coverage/python/.coverage
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'

      - name: Install locked dependencies and shell coverage parser
        run: |
          uv sync --locked
          mkdir -p artifacts/coverage/python artifacts/coverage/shell artifacts/coverage/native
          GOBIN="$RUNNER_TEMP/mt5-tools" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$RUNNER_TEMP/mt5-tools" >> "$GITHUB_PATH"

      - name: Lint every maintained source file
        run: |
          uv run --locked python build/lint.py
          python3 build/render-dockerfiles.py --check

      - name: Record source hashes before collecting coverage
        run: uv run --locked python build/coverage_report.py --record-sources artifacts/coverage/sources.json

      - name: Test Python and Bash with per-file coverage
        env:
          BASH_ENV: ${{ github.workspace }}/tests/shell_trace.sh
          MT5_SHELL_COVERAGE_DIR: ${{ github.workspace }}/artifacts/coverage/shell
          MT5_SHELL_COVERAGE_MAP: ${{ github.workspace }}/artifacts/coverage/shell/maps.jsonl
        run: |
          uv run --locked coverage run --parallel-mode -m unittest discover -s tests -v \
            2>&1 | tee artifacts/coverage/python/unittest.log

      - name: Preserve Python coverage reports
        if: always()
        run: |
          uv run --locked coverage combine --keep
          cp "$COVERAGE_FILE" artifacts/coverage/python/combined.coverage
          uv run --locked coverage json
          uv run --locked coverage xml
          uv run --locked coverage html

      - uses: docker/setup-buildx-action@v4 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Prepare native coverage build
        run: cat Dockerfile.fedora-44 tests/native/Dockerfile.fragment > "$RUNNER_TEMP/Dockerfile.native-coverage"

      - name: Build native tests with coverage
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.native-coverage
          target: native-coverage
          platforms: linux/amd64
          load: true
          tags: mt5:native-coverage
          cache-from: type=gha,scope=mt5-native-coverage-fedora-44
          cache-to: type=gha,scope=mt5-native-coverage-fedora-44,mode=max,ignore-error=true

      - name: Run isolated native tests and collect reports
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/artifacts/coverage/native:/coverage" mt5:native-coverage

      - name: Require at least 94 percent coverage for every source file
        if: always()
        run: |
          uv run --locked python build/coverage_report.py \
            --source-manifest artifacts/coverage/sources.json \
            --python-data artifacts/coverage/python/combined.coverage \
            --shell-traces artifacts/coverage/shell \
            --shell-map artifacts/coverage/shell/maps.jsonl \
            --native-report artifacts/coverage/native/native.json \
            --output artifacts/coverage/report

      - name: Check Dependabot and Windows dependency resolution
        run: |
          uv pip compile build/mt5-mcp-requirements.in --universal --python-version 3.12 \
            --constraints build/mt5-mcp-requirements.txt --output-file "$RUNNER_TEMP/mt5-universal.txt"
          uv pip compile build/mt5-mcp-requirements.in build/mt5-mcp-requirements.txt \
            --python-version 3.12 --python-platform x86_64-manylinux_2_39 \
            --output-file "$RUNNER_TEMP/mt5-linux.txt"
          uv pip install --dry-run --python-version 3.12 --python-platform x86_64-pc-windows-msvc \
            --target "$RUNNER_TEMP/mt5-windows" -r build/mt5-mcp-requirements.txt

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Retain source coverage evidence
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: source-coverage
          path: artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  images:
    name: ${{ matrix.distro }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-44, debian-13, ubuntu-26.04, archlinux]
    env:
      DISTRO: ${{ matrix.distro }}
      IMAGE: mt5:${{ matrix.distro }}
      FIXTURE_IMAGE: mt5:ci-fixture-${{ matrix.distro }}
      POINTER_PARENT_IMAGE: mt5:ci-pointer-parent
      KWIN_VARIANT: source

    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'

      - name: Select registry and publication policy
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: >-
            ${{ (github.event_name == 'push' &&
                 (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) ||
                (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Check broker acceptance settings
        if: steps.policy.outputs.publish == 'true'
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          build/ci-broker-env

      - name: Prepare standard runner
        run: |
          # Reclaim unused hosted SDKs; keep the compiler and Docker toolchains.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
          docker info >/dev/null
          if [[ ! -c /dev/udmabuf ]]; then sudo modprobe udmabuf; fi
          test -c /dev/udmabuf
          free_kib=$(df -Pk "$(docker info --format '{{.DockerRootDir}}')" | awk 'NR==2 {print $4}')
          if ((free_kib < 25 * 1024 * 1024)); then
            echo '::error::MT5/Wine builds need at least 25 GiB free after removing unused hosted SDKs.'
            exit 1
          fi
          uv sync --locked
          mkdir -p artifacts

      - uses: docker/setup-buildx-action@v4 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6 # v6
        with:
          images: ${{ steps.policy.outputs.image }}
          flavor: latest=false
          labels: io.skynet.kwin.variant=${{ env.KWIN_VARIANT }}
          tags: |
            type=raw,value=${{ matrix.distro }},enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-,suffix=-${{ matrix.distro }}
            type=ref,event=tag,suffix=-${{ matrix.distro }}
            type=ref,event=pr,suffix=-${{ matrix.distro }}

      - name: Build and load production image
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          target: mt5
          # Switch to distro to skip private apt builds when runner space is limited.
          # Fedora/Arch ignore this argument.
          build-args: KWIN_VARIANT=${{ env.KWIN_VARIANT }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mt5-${{ matrix.distro }}-${{ env.KWIN_VARIANT }}
          cache-to: type=gha,scope=mt5-${{ matrix.distro }}-${{ env.KWIN_VARIANT }},mode=max,ignore-error=true

      - name: Check installed MT5, WebView2 and Windows dependencies without an account
        run: uv run --locked python tests/ci-smoke.py "$IMAGE" --output "artifacts/smoke/$DISTRO"

      - name: Build matching GUI fixture
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          target: runtime-test
          build-args: KWIN_VARIANT=${{ env.KWIN_VARIANT }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.FIXTURE_IMAGE }}
          cache-from: type=gha,scope=mt5-${{ matrix.distro }}-${{ env.KWIN_VARIANT }}

      - name: Reclaim SDK build cache when runner space is low
        run: |
          free_kib=$(df -Pk "$(docker info --format '{{.DockerRootDir}}')" | awk 'NR==2 {print $4}')
          if ((free_kib < 20 * 1024 * 1024)); then
            # Loaded images stay available while unused compiler snapshots are freed.
            docker buildx prune --all --force
          fi

      - name: Prepare decorated pointer parent build
        run: cat Dockerfile.archlinux tests/Dockerfile.pointer-parent.fragment > "$RUNNER_TEMP/Dockerfile.pointer-parent"

      - name: Build and load the decorated Arch pointer parent
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.pointer-parent
          target: pointer-parent
          platforms: linux/amd64
          load: true
          tags: ${{ env.POINTER_PARENT_IMAGE }}
          cache-from: type=gha,scope=mt5-archlinux-${{ env.KWIN_VARIANT }}

      - name: Test every display mode with GUI input and screenshot evidence
        env:
          IMAGE_TAG: ${{ env.IMAGE }}
          PARENT_IMAGE: ${{ env.FIXTURE_IMAGE }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/display-matrix
        run: |
          tests/display-matrix.sh "$DISTRO"

      - name: Install headless Chromium for MT5 browser input tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: uv run --locked playwright install --with-deps --only-shell chromium

      - name: Verify real MT5 mouse and keyboard input in all eight GUI profiles
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$FIXTURE_IMAGE" \
            --case "$DISTRO" --output artifacts/mt5-input

      - name: Verify advanced MT5 pointer behavior with a decorated parent
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$POINTER_PARENT_IMAGE" \
            --case "$DISTRO" --output artifacts/pointer-matrix \
            --modes nested --pointer-scales 1 1.25 2

      - name: Verify first chart input without a masking startup dialog
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$FIXTURE_IMAGE" \
            --case "$DISTRO" --output artifacts/mt5-autologin-input \
            --startup autologin

      - name: Verify scaled chart input without a masking startup dialog
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$POINTER_PARENT_IMAGE" \
            --case "$DISTRO" --output artifacts/autologin-pointer-matrix \
            --modes nested --pointer-scales 1 1.25 2 --startup autologin

      - name: Verify broker login, MCP and expert backtests in all eight modes
        if: steps.policy.outputs.publish == 'true'
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_ENV_FILE: /dev/null
          HOST_DISPLAY_BACKEND: x11
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/broker
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' tests/matrix.sh "$DISTRO"

      - name: Record tested image identity
        run: |
          docker image inspect --format '{{.Id}}' "$IMAGE" > artifacts/tested-image-id.txt
          echo "Tested $IMAGE: $(cat artifacts/tested-image-id.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: steps.policy.outputs.publish == 'true'
        uses: docker/login-action@v4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image without rebuilding
        if: steps.policy.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(cat artifacts/tested-image-id.txt)"
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
            echo "Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: validation-${{ matrix.distro }}
          path: |
            artifacts/smoke/
            artifacts/display-matrix/
            artifacts/mt5-input/
            artifacts/mt5-autologin-input/
            artifacts/autologin-pointer-matrix/
            artifacts/pointer-matrix/
            artifacts/tested-image-id.txt
            artifacts/broker/*/chart.png
            artifacts/broker/*/summary.json
            artifacts/broker/*/diagnostics.json
            !artifacts/display-matrix/**/parent/runtime/**
            !artifacts/display-matrix/**/parent/x11/**
            !artifacts/display-matrix/**/parent/Xauthority
            !artifacts/mt5-input/**/parent/runtime/**
            !artifacts/mt5-input/**/parent/x11/**
            !artifacts/mt5-input/**/parent/Xauthority
            !artifacts/mt5-autologin-input/**/parent/runtime/**
            !artifacts/mt5-autologin-input/**/parent/x11/**
            !artifacts/mt5-autologin-input/**/parent/Xauthority
            !artifacts/autologin-pointer-matrix/**/parent/runtime/**
            !artifacts/autologin-pointer-matrix/**/parent/x11/**
            !artifacts/autologin-pointer-matrix/**/parent/Xauthority
            !artifacts/pointer-matrix/**/parent/runtime/**
            !artifacts/pointer-matrix/**/parent/x11/**
            !artifacts/pointer-matrix/**/parent/Xauthority
          if-no-files-found: warn
          retention-days: 14
