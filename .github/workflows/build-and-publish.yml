name: Build, test and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Run broker acceptance and publish tested images
        type: boolean
        default: true
      broker:
        description: Validate real broker autologin without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mt5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'main' || format('sha-{0}', github.sha) }}
  CACHE_WRITE: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  headless:
    name: Standalone headless image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - name: Select registry and publication policy
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: >-
            ${{ (github.event_name == 'push' &&
                 (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) ||
                (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Check broker acceptance settings
        if: steps.policy.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.broker)
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: build/ci-broker-env

      - uses: docker/setup-buildx-action@v4 # v4

      - name: Log in to GHCR for build cache and publication
        uses: docker/login-action@v4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6 # v6
        with:
          images: ${{ steps.policy.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=headless,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-,suffix=-headless
            type=ref,event=tag,suffix=-headless

      - name: Build and load standalone headless image
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: headless/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mt5:headless
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-headless-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-headless-main
            type=gha,scope=mt5-headless
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-headless-{1},mode=max', steps.policy.outputs.image, env.CACHE_SCOPE) || '' }}

      - name: Test configuration and MCP
        run: python3 tests/headless_smoke.py --image mt5:headless

      - name: Validate broker autologin through the host MCP port
        if: steps.policy.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.broker)
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: python3 tests/headless_smoke.py --image mt5:headless --broker --output artifacts/headless-broker

      - name: Publish the tested headless image without rebuilding
        if: steps.policy.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tested=$(python3 -c 'import json; print(json.load(open("artifacts/headless-broker/results.json"))["image_id"])')
          test "$(docker image inspect --format '{{.Id}}' mt5:headless)" = "$tested"
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            docker tag "$tested" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Retain headless evidence
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: headless-smoke
          path: |
            artifacts/headless-smoke/
            artifacts/headless-broker/results.json
          if-no-files-found: warn
          retention-days: 14

  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      COVERAGE_FILE: ${{ github.workspace }}/artifacts/coverage/python/.coverage
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'

      - name: Install locked dependencies and shell coverage parser
        run: |
          uv sync --locked
          mkdir -p artifacts/coverage/python artifacts/coverage/shell artifacts/coverage/native
          GOBIN="$RUNNER_TEMP/mt5-tools" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$RUNNER_TEMP/mt5-tools" >> "$GITHUB_PATH"

      - name: Lint every maintained source file
        run: |
          uv run --locked python build/lint.py

      - name: Record source hashes before collecting coverage
        run: uv run --locked python build/coverage_report.py --record-sources artifacts/coverage/sources.json

      - name: Test Python and Bash with per-file coverage
        env:
          BASH_ENV: ${{ github.workspace }}/tests/shell_trace.sh
          MT5_SHELL_COVERAGE_DIR: ${{ github.workspace }}/artifacts/coverage/shell
          MT5_SHELL_COVERAGE_MAP: ${{ github.workspace }}/artifacts/coverage/shell/maps.jsonl
        run: |
          uv run --locked coverage run --parallel-mode -m unittest discover -s tests -v \
            2>&1 | tee artifacts/coverage/python/unittest.log

      - name: Preserve Python coverage reports
        if: always()
        run: |
          uv run --locked coverage combine --keep
          cp "$COVERAGE_FILE" artifacts/coverage/python/combined.coverage
          uv run --locked coverage json
          uv run --locked coverage xml
          rm -rf artifacts/coverage/python/html
          uv run --locked coverage html

      - uses: docker/setup-buildx-action@v4 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Select cache registry
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for build cache
        uses: docker/login-action@v4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare native coverage build
        run: cat Dockerfile.debian-13 tests/native/Dockerfile.fragment > "$RUNNER_TEMP/Dockerfile.native-coverage"

      - name: Build native tests with coverage
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.native-coverage
          target: native-coverage
          platforms: linux/amd64
          load: true
          tags: mt5:native-coverage
          cache-from: |
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-main
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-main
            type=gha,scope=mt5-native-coverage-debian-13
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-native-{1},mode=max', steps.policy.outputs.image, env.CACHE_SCOPE) || '' }}

      - name: Run isolated native tests and collect reports
        run: |
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/artifacts/coverage/native:/coverage" mt5:native-coverage

      - name: Require at least 94 percent coverage for every source file
        if: always()
        run: |
          uv run --locked python build/coverage_report.py \
            --source-manifest artifacts/coverage/sources.json \
            --python-data artifacts/coverage/python/combined.coverage \
            --shell-traces artifacts/coverage/shell \
            --shell-map artifacts/coverage/shell/maps.jsonl \
            --native-report artifacts/coverage/native/native.json \
            --output artifacts/coverage/report

      - name: Check Dependabot and Windows dependency resolution
        run: |
          uv pip compile build/mt5-mcp-requirements.in --universal --python-version 3.12 \
            --constraints build/mt5-mcp-requirements.txt --output-file "$RUNNER_TEMP/mt5-universal.txt"
          uv pip compile build/mt5-mcp-requirements.in build/mt5-mcp-requirements.txt \
            --python-version 3.12 --python-platform x86_64-manylinux_2_39 \
            --output-file "$RUNNER_TEMP/mt5-linux.txt"
          uv pip install --dry-run --python-version 3.12 --python-platform x86_64-pc-windows-msvc \
            --target "$RUNNER_TEMP/mt5-windows" -r build/mt5-mcp-requirements.txt

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Retain source coverage evidence
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: source-coverage
          path: artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Debian KDE image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      DISTRO: debian-13
      IMAGE: mt5:debian-13
      FIXTURE_IMAGE: mt5:ci-fixture-debian-13
      POINTER_PARENT_IMAGE: mt5:ci-pointer-parent

    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'

      - name: Select registry and publication policy
        id: policy
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: >-
            ${{ (github.event_name == 'push' &&
                 (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) ||
                (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Check broker acceptance settings
        if: steps.policy.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.broker)
        env:
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          build/ci-broker-env

      - name: Prepare standard runner
        run: |
          # Reclaim unused hosted SDKs; keep the compiler and Docker toolchains.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
          docker info >/dev/null
          if [[ ! -c /dev/udmabuf ]]; then sudo modprobe udmabuf; fi
          test -c /dev/udmabuf
          free_kib=$(df -Pk "$(docker info --format '{{.DockerRootDir}}')" | awk 'NR==2 {print $4}')
          if ((free_kib < 25 * 1024 * 1024)); then
            echo '::error::MT5/Wine builds need at least 25 GiB free after removing unused hosted SDKs.'
            exit 1
          fi
          uv sync --locked
          mkdir -p artifacts

      - uses: docker/setup-buildx-action@v4 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR for build cache and publication
        uses: docker/login-action@v4 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6 # v6
        with:
          images: ${{ steps.policy.outputs.image }}
          flavor: latest=false
          labels: io.skynet.kwin.variant=source
          tags: |
            type=raw,value=debian-13,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-,suffix=-debian-13
            type=ref,event=tag,suffix=-debian-13
            type=ref,event=pr,suffix=-debian-13

      - name: Cache compiled KDE dependencies and load the GUI fixture
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: Dockerfile.debian-13
          target: runtime-test
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.FIXTURE_IMAGE }}
          cache-from: |
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-main
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-main
            type=gha,scope=mt5-debian-13-source
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-debian-13-{1},mode=max', steps.policy.outputs.image, env.CACHE_SCOPE) || '' }}

      - name: Build and load production image
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: Dockerfile.debian-13
          target: mt5
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-main
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-native-main
            type=gha,scope=mt5-debian-13-source
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-debian-13-{1},mode=max', steps.policy.outputs.image, env.CACHE_SCOPE) || '' }}

      - name: Check installed MT5, WebView2 and Windows dependencies without an account
        run: uv run --locked python tests/ci-smoke.py "$IMAGE" --output "artifacts/smoke/$DISTRO"

      - name: Prepare decorated pointer parent build
        run: cat Dockerfile.debian-13 tests/Dockerfile.pointer-parent.fragment > "$RUNNER_TEMP/Dockerfile.pointer-parent"

      - name: Load the pinned upstream KDE host with the pointer-test fixture
        uses: docker/build-push-action@v7 # v7
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.pointer-parent
          target: pointer-parent
          platforms: linux/amd64
          load: true
          tags: ${{ env.POINTER_PARENT_IMAGE }}
          cache-from: |
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.policy.outputs.image }}:buildcache-debian-13-main

      - name: Reclaim SDK build cache when runner space is low
        run: |
          free_kib=$(df -Pk "$(docker info --format '{{.DockerRootDir}}')" | awk 'NR==2 {print $4}')
          if ((free_kib < 20 * 1024 * 1024)); then
            # All three images now share the completed KDE build; keep it until the parent is loaded.
            docker buildx prune --all --force
          fi

      - name: Bind validation to immutable image identities
        run: |
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          names = ("IMAGE", "FIXTURE_IMAGE", "POINTER_PARENT_IMAGE")
          images = {
              name: subprocess.check_output(
                  ["docker", "image", "inspect", "--format", "{{.Id}}", os.environ[name]],
                  text=True,
              ).strip()
              for name in names
          }
          if not all(re.fullmatch(r"sha256:[0-9a-f]{64}", image) for image in images.values()):
              raise RuntimeError("Docker did not return immutable image IDs")
          dirty = bool(subprocess.check_output(["git", "status", "--porcelain"], text=True).strip())
          if dirty:
              raise RuntimeError("CI tester worktree is dirty")
          sources = (
              "tests/mt5_market.py", "tests/mt5_market_probe.py", "tests/mt5_ui_probe.py",
              "tests/runtime.py", "tests/mt5_input.py",
          )
          receipt = {
              "git_revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "worktree_dirty": dirty,
              "source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sources},
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/build-and-publish.yml").read_bytes()).hexdigest(),
              "images": images,
          }
          Path("artifacts/ci-images.json").write_text(json.dumps(receipt, indent=2) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              for name, image in images.items():
                  environment.write(f"{name}={image}\n")
          PY

      - name: Test every display mode with GUI input and screenshot evidence
        env:
          IMAGE_TAG: ${{ env.IMAGE }}
          PARENT_IMAGE: ${{ env.FIXTURE_IMAGE }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/display-matrix
        run: |
          tests/display-matrix.sh "$DISTRO"

      - name: Install headless Chromium for MT5 browser input tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: uv run --locked playwright install --with-deps --only-shell chromium

      - name: Verify real MT5 mouse and keyboard input in all eight GUI profiles
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$FIXTURE_IMAGE" \
            --case "$DISTRO" --output artifacts/mt5-input

      - name: Verify advanced MT5 pointer behavior with a decorated parent
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$POINTER_PARENT_IMAGE" \
            --case "$DISTRO" --output artifacts/pointer-matrix \
            --modes nested --pointer-scales 1 1.25 2

      - name: Verify first chart input without a masking startup dialog
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$FIXTURE_IMAGE" \
            --case "$DISTRO" --output artifacts/mt5-autologin-input \
            --startup autologin

      - name: Verify scaled chart input without a masking startup dialog
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_input.py \
            --image "$IMAGE" --parent-image "$POINTER_PARENT_IMAGE" \
            --case "$DISTRO" --output artifacts/autologin-pointer-matrix \
            --modes nested --pointer-scales 1 1.25 2 --startup autologin

      - name: Verify Market browser painting in all ten display profiles
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mt5-playwright
        run: |
          uv run --locked python tests/mt5_market.py \
            --image "$IMAGE" --parent-image "$FIXTURE_IMAGE" \
            --case "$DISTRO" --output artifacts/mt5-market

      - name: Verify broker login, MCP and expert backtests in all eight modes
        if: steps.policy.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.broker)
        env:
          IMAGE_TAG: ${{ env.IMAGE }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_ENV_FILE: /dev/null
          HOST_DISPLAY_BACKEND: x11
          OUTPUT_DIR: ${{ github.workspace }}/artifacts/broker
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' tests/matrix.sh "$DISTRO"

      - name: Record tested image identity
        run: |
          docker image inspect --format '{{.Id}}' "$IMAGE" > artifacts/tested-image-id.txt
          echo "Tested $IMAGE: $(cat artifacts/tested-image-id.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the tested image without rebuilding
        if: steps.policy.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(cat artifacts/tested-image-id.txt)"
          while IFS= read -r tag; do
            [[ -n $tag ]] || continue
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
            echo "Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7 # v7
        with:
          name: validation-debian-13
          path: |
            artifacts/smoke/
            artifacts/display-matrix/
            artifacts/mt5-input/
            artifacts/mt5-autologin-input/
            artifacts/autologin-pointer-matrix/
            artifacts/pointer-matrix/
            artifacts/mt5-market/
            artifacts/tested-image-id.txt
            artifacts/ci-images.json
            artifacts/broker/*/chart.png
            artifacts/broker/*/summary.json
            artifacts/broker/*/diagnostics.json
            !artifacts/display-matrix/**/parent/runtime/**
            !artifacts/display-matrix/**/parent/x11/**
            !artifacts/display-matrix/**/parent/Xauthority
            !artifacts/mt5-input/**/parent/runtime/**
            !artifacts/mt5-input/**/parent/x11/**
            !artifacts/mt5-input/**/parent/Xauthority
            !artifacts/mt5-autologin-input/**/parent/runtime/**
            !artifacts/mt5-autologin-input/**/parent/x11/**
            !artifacts/mt5-autologin-input/**/parent/Xauthority
            !artifacts/autologin-pointer-matrix/**/parent/runtime/**
            !artifacts/autologin-pointer-matrix/**/parent/x11/**
            !artifacts/autologin-pointer-matrix/**/parent/Xauthority
            !artifacts/pointer-matrix/**/parent/runtime/**
            !artifacts/pointer-matrix/**/parent/x11/**
            !artifacts/pointer-matrix/**/parent/Xauthority
            !artifacts/mt5-market/**/parent/runtime/**
            !artifacts/mt5-market/**/parent/x11/**
            !artifacts/mt5-market/**/parent/Xauthority
            !artifacts/mt5-market/**/plasma-ui-fixture
          if-no-files-found: warn
          retention-days: 14
